name: CI / CD
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8","3.9","3.10","3.11","3.12","3.13"]
    runs-on: ubuntu-latest
    steps:      
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          sudo apt-get install -y libgeos-c1v5
      - run: |
          uv sync --extra shapely
      - name: Run Tests
        run: uv run py.test

  build:
    strategy:
      fail-fast: false
      matrix:
        os: 
          - ubuntu
          - windows
          # - macos
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run the build process
        run: uv run pyinstaller --onefile preprocess_cancellation.py
      - name: Archive production artifacts
        uses: actions/upload-artifact@v2
        with:
          name: preprocess_cancellation-${{ matrix.os }}
          path: |
            dist

  release:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v2
      
      - name: Release tags
        uses: softprops/action-gh-release@v1
        with:
         files: |
           */preprocess_cancellation-*.zip
